name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 clang-format-18 clang-tidy-18 lld-18 \
            cmake ninja-build jq \
            catch2 libbenchmark-dev nlohmann-json3-dev

      - name: Verificar prerequisitos
        run: ./scripts/bootstrap.sh

      - name: Gate
        run: ./scripts/gate.sh

      - name: Autoprueba del gate
        run: ./scripts/gate-selftest.sh --fast
